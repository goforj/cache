name: Go Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.27.x", "stable"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check every module against staged siblings
        env:
          CACHE_LOCAL_SIBLINGS: "1"
        run: scripts/check-quality.sh

  published-minimum-go:
    name: Published minimum Go (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - go-version: "1.24.4"
            modules: "cachecore cachetest driver/dynamocache driver/memcachedcache driver/mysqlcache driver/rediscache driver/sqlcore"
          - go-version: "1.25.0"
            modules: "driver/postgrescache driver/sqlitecache"
          - go-version: "1.26.0"
            modules: "driver/natscache"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up minimum Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Validate published modules at their supported minimum
        env:
          GOWORK: "off"
          CACHE_MINIMUM_MODULES: ${{ matrix.modules }}
        run: |
          set -euo pipefail
          for module in $CACHE_MINIMUM_MODULES; do
            (
              cd "$module"
              go mod tidy -diff
              go vet ./...
              go test -race ./... -count=1
            )
          done

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Download dependencies
        run: go mod download

      - name: Download examples module dependencies
        run: |
          cd examples
          GOWORK=off go mod download

      - name: Run unit tests
        run: go test ./... -v

      - name: Enforce root coverage floor
        env:
          COVERAGE_MIN: "97.0"
        run: scripts/check-coverage.sh

      - name: Verify generated examples compile
        run: |
          cd examples
          GOWORK=off go test ./... -run TestExamplesBuild -count=1 -v

      - name: Run unit tests with coverage
        env:
          INTEGRATION_MODULE_DRIVERS: all
        run: scripts/coverage-codecov.sh

      - name: Upload results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.txt
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Download dependencies
        run: go mod download

      - name: Run race tests
        run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: ["null", memory, file, rediscache, natscache, memcachedcache, dynamocache, sqlitecache, postgrescache, mysqlcache]
    env:
      GOCACHE: /tmp/go-build-cache
      INTEGRATION_DRIVER: ${{ matrix.driver }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Download dependencies
        run: |
          go mod download
          cd integration
          GOWORK=off go mod download

      - name: Run integration tests (per driver, with retries)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Integration attempt ${attempt}/3 for driver=${INTEGRATION_DRIVER}"
            if (cd integration && GOWORK=off go test -tags=integration -v -count=1 ./root ./all); then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Integration failed after 3 attempts for driver=${INTEGRATION_DRIVER}"
              exit 1
            fi
            sleep $((attempt * 5))
          done
