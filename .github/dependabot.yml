version: 2
# Compatible releases are batched across modules so shared driver dependencies
# move together and produce one repository-level validation result.
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /cachecore
      - /cachetest
      - /docs
      - /driver/dynamocache
      - /driver/memcachedcache
      - /driver/mysqlcache
      - /driver/natscache
      - /driver/postgrescache
      - /driver/rediscache
      - /driver/sqlcore
      - /driver/sqlitecache
      - /examples
      - /integration
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      compatible-go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
