version: 2
# Update nested modules separately. Running from / makes Dependabot read
# go.work and copy dependencies between modules, which can raise Go requirements.
# See scripts/RELEASE.md for maintenance of the main cache module.
updates:
  - package-ecosystem: gomod
    directories:
      - /cachecore
      - /cachetest
      - /driver/dynamocache
      - /driver/memcachedcache
      - /driver/mysqlcache
      - /driver/rediscache
      - /driver/sqlcore
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    # These releases require a newer Go version than this group supports.
    ignore:
      - dependency-name: github.com/redis/go-redis/v9
        versions: [">=9.23.0"]
      - dependency-name: golang.org/x/sys
        versions: [">=0.42.0"]
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      compatible-go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directories:
      - /driver/postgrescache
      - /driver/sqlitecache
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    # These releases require a newer Go version than this group supports.
    ignore:
      - dependency-name: modernc.org/sqlite
        versions: [">=1.60.0"]
      - dependency-name: golang.org/x/sync
        versions: [">=0.23.0"]
      - dependency-name: golang.org/x/text
        versions: [">=0.42.0"]
      - dependency-name: golang.org/x/sys
        versions: [">=0.48.0"]
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      compatible-go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directories:
      - /driver/natscache
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      compatible-go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directories:
      - /docs
      - /examples
      - /integration
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      compatible-go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
